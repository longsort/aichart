<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="700" fill="#0f172a">Butterfly</text>
  <polyline fill="none" stroke="#0f172a" stroke-width="2.5" points="120,200 300,400 480,220 640,340 900,80"/>
  <text x="120" y="190" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">X</text>
  <text x="300" y="390" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">A</text>
  <text x="480" y="210" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">B</text>
  <text x="640" y="330" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">C</text>
  <text x="900" y="70" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">D</text>
  <text x="80" y="430" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">AB=0.786 XA   AD=1.27–1.618 XA   D beyond X</text>
  <text x="80" y="455" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">PRZ at D is a zone, not a fill. Invalid if XA structure breaks.</text>
</svg>

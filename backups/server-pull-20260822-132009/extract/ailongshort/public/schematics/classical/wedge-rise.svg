  <text x="500" y="28" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="700" fill="#0f172a">Rising Wedge</text>
  <line x1="120" y1="360" x2="820" y2="140" stroke="#0f172a" stroke-width="2"/>
  <line x1="120" y1="300" x2="820" y2="60" stroke="#0f172a" stroke-width="2"/>
